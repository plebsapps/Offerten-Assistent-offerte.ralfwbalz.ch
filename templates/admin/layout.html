<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>{% block title %}Admin – Offerten-Assistent{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css?v=9">
</head>
<body>
  {% set p = request.url.path %}
  <header class="admin-topbar">
    <nav class="adminnav">
      <a href="/admin" class="{{ 'active' if p == '/admin' else '' }}">Dashboard</a>
      <a href="/admin/zugang" class="{{ 'active' if p.startswith('/admin/zugang') else '' }}">Zugang</a>
      <a href="/admin/gespraeche" class="{{ 'active' if p.startswith('/admin/gespraeche') else '' }}">Gespräche</a>
      <a href="/admin/offerten" class="{{ 'active' if p.startswith('/admin/offerten') else '' }}">Offerten</a>
      <a href="/admin/einstellungen" class="{{ 'active' if p.startswith('/admin/einstellungen') else '' }}">Einstellungen</a>
    </nav>
    <div class="admin-title">Admin Offerten-Assistent</div>
    <a class="adminnav-logout" href="/admin/logout">Abmelden</a>
  </header>

  <main class="admin-wrap">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
