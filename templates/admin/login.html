<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Admin-Login – Offerten-Assistent</title>
  <link rel="stylesheet" href="/static/css/style.css?v=10">
</head>
<body>
  <header class="admin-topbar">
    <span class="adminnav" aria-hidden="true"></span>
    <div class="admin-title">Admin Offerten-Assistent</div>
    <a class="adminnav-logout" href="/">Zum Assistenten</a>
  </header>

  <main class="admin-login">
    <h1>Administration</h1>
    {% if fehler %}
    <div class="banner-error">{{ fehler }}</div>
    {% endif %}
    <form method="post" action="/admin/login" class="admin-card">
      <label>Benutzer
        <input name="benutzer" autocomplete="username" required>
      </label>
      <label>Passwort
        <input name="passwort" type="password" autocomplete="current-password" required>
      </label>
      <button type="submit" class="btn-primary">Anmelden</button>
    </form>
  </main>
</body>
</html>
