  <!-- Google tag (gtag.js), Consent Mode im Basis-Modus: gtag.js wird erst
       nach der Zustimmung im Banner geladen, vorher geht nichts an Google.
       Die Wahl liegt im Cookie werbe_einwilligung (ja|nein) auf ralfwbalz.ch und
       gilt damit für ralfwbalz.ch und offerte.ralfwbalz.ch gemeinsam; das
       Banner selbst baut static/js/einwilligung.js. -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    window.googleAds = { id: {{ google_ads_id|tojson }}, konversion: {{ google_ads_konversion|tojson }} };
    window.googleAds.einwilligungMerken = function (wert) {
      // Domain nur auf dem echten Host setzen, sonst verwirft der Browser das Cookie (lokal)
      var gemeinsam = /(^|\.)ralfwbalz\.ch$/.test(location.hostname);
      document.cookie = 'werbe_einwilligung=' + wert + '; Max-Age=31536000; Path=/; SameSite=Lax'
        + (gemeinsam ? '; Domain=ralfwbalz.ch' : '')
        + (location.protocol === 'https:' ? '; Secure' : '');
    };
    window.googleAds.einwilligung = function () {
      var m = document.cookie.match(/(?:^|;\s*)werbe_einwilligung=(ja|nein)/);
      var wahl = m ? m[1] : null;
      // Wahl aus der Zeit vor dem gemeinsamen Cookie (localStorage, pro Domain): eine
      // Ablehnung gilt weiter und sticht, eine Zustimmung galt nur für die eine Website
      // und wird deshalb nicht übernommen.
      try {
        var alt = localStorage.getItem('werbe_einwilligung');
        localStorage.removeItem('werbe_einwilligung');
        if (alt === 'nein' && wahl !== 'nein') {
          window.googleAds.einwilligungMerken('nein');
          wahl = 'nein';
        }
      } catch (e) { /* ohne localStorage gibt es nichts zu übernehmen */ }
      return wahl;
    };
    window.googleAdsLaden = function () {
      if (window.googleAds.geladen) return;
      window.googleAds.geladen = true;
      gtag('consent', 'default', {
        ad_storage: 'granted', ad_user_data: 'granted',
        ad_personalization: 'granted', analytics_storage: 'denied'
      });
      var s = document.createElement('script');
      s.async = true;
      s.src = 'https://www.googletagmanager.com/gtag/js?id=' + window.googleAds.id;
      document.head.appendChild(s);
      gtag('js', new Date());
      gtag('config', window.googleAds.id);
    };
    if (window.googleAds.einwilligung() === 'ja') window.googleAdsLaden();
  </script>
